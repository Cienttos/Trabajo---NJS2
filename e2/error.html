<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error en la carga del archivo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      color: #333;
      text-align: center;
      padding: 50px;
    }
    h1 {
      font-size: 3em;
      color: red;
      margin-bottom: 20px;
    }
    p {
      font-size: 1.5em;
    }
    .error-message {
      color: #b10000;
      font-weight: bold;
    }
    .retry-button {
      margin-top: 30px;
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      font-size: 1.2em;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }
    .retry-button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <h1>¡Hubo un error!</h1>
  <p class="error-message">No se pudo leer el archivo HTML. Verifica que el archivo "index.html" esté presente.</p>
  <p>Intenta recargar la página o contacta con el administrador si el problema persiste.</p>
  <button class="retry-button" onclick="window.location.reload();">Recargar Página</button>
</body>
</html>
